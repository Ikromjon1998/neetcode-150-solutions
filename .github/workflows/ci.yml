name: CI

# This workflow runs in two quite different kinds of repository, and does different things in
# each.
#
#   The platform (Ikromjon1998/neetcode-150)
#     - every function in packages/core-* must still be an unsolved stub
#     - the reference answers under solutions/ must still pass all six suites
#
#   A solutions repo (anything made with "Use this template", and any fork)
#     - the problems YOU have solved must pass
#     - solved functions are expected, so the stub check is skipped
#
# Without that split, a learner's repo would fail CI forever: they commit solutions, and the
# platform's "everything must be unsolved" rule would reject their own work.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Contracts are valid and implemented in all three languages
        run: python3 tools/validate_contracts.py

      # Only the platform's `main` ships unsolved stubs — it is what people copy. A solutions
      # repo is exactly where solved functions belong, so this is skipped there.
      # Running on pull requests into main is what stops solutions being merged by accident.
      - name: Every live file is still an unsolved stub
        if: github.repository == 'Ikromjon1998/neetcode-150' && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
        run: python3 tools/solutions.py status --assert-stubs

      - name: Problem briefs are up to date with the contracts
        run: |
          python3 tools/render_statements.py
          git diff --exit-code docs/problems/ \
            || { echo "::error::docs/problems is stale — run 'make statements' and commit"; exit 1; }

  solutions:
    name: Reference solutions still pass
    if: github.repository == 'Ikromjon1998/neetcode-150'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mbstring, json", coverage: none }

      - name: Install
        run: |
          pip install -e "packages/core-python[dev]" -e "apps/api-python[dev]"
          npm ci
          npm run build --workspace @neetcode/core
          (cd packages/core-php && composer install --no-interaction --prefer-dist)
          (cd apps/api-php && composer install --no-interaction --prefer-dist \
             && cp .env.example .env && php artisan key:generate)

      # The checkout is disposable here, so the answers are applied in place.
      - name: Apply reference solutions
        run: |
          python3 tools/solutions.py apply --force
          npm run build --workspace @neetcode/core

      - name: Python
        run: |
          (cd packages/core-python && pytest -q)
          (cd apps/api-python && pytest -q)
      - name: TypeScript
        run: |
          npm run test --workspace @neetcode/core
          npm run test --workspace @neetcode/api-node
      - name: PHP
        run: |
          (cd packages/core-php && ./vendor/bin/phpunit)
          (cd apps/api-php && php artisan test)

  solved:
    name: Your solved problems
    if: github.repository != 'Ikromjon1998/neetcode-150'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mbstring, json", coverage: none }

      - name: Install
        run: |
          pip install -e "packages/core-python[dev]"
          npm ci
          npm run build --workspace @neetcode/core
          (cd packages/core-php && composer install --no-interaction --prefer-dist)

      # Green means "everything I have solved so far is correct". Problems still untouched are
      # ignored, so this does not go red simply because the 150 are not finished.
      - name: Test what you have solved
        run: python3 tools/test_solved.py

  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "mbstring, json", coverage: none }

      - name: Install
        run: |
          pip install -e "packages/core-python[dev]" -e "apps/api-python[dev]"
          npm ci
          npm run build --workspace @neetcode/core
          (cd apps/api-php && composer install --no-interaction --prefer-dist)

      # In a solutions repo this lints YOUR code too, which is useful feedback.
      - name: Python
        run: |
          ruff check packages/core-python apps/api-python
          (cd packages/core-python && mypy)
      - name: TypeScript
        run: |
          npx tsc --noEmit -p packages/core-ts/tsconfig.json
          npx tsc --noEmit -p apps/api-node/tsconfig.json
      - name: PHP
        run: (cd apps/api-php && ./vendor/bin/pint --test)
