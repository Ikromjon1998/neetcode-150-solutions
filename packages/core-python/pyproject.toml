[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neetcode-core"
version = "1.0.0"
description = "Pure, framework-free NeetCode algorithms in Python. Zero runtime dependencies on purpose."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ikromjon Ochilov" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/neetcode_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `from tests.conftest import ...` resolves. The `pytest` console script does not add
# the working directory to sys.path (only `python -m pytest` does), and relying on that
# difference is how a suite passes locally and fails in CI.
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["neetcode_core"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
